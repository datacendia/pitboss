# Static site — no build step. build.py is run locally and both HTML
# outputs are committed, so Netlify only has to serve files.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Charset is explicit in the document too, but being served correctly
# matters more: without it the data files decode as windows-1252 and
# every dash, arrow and pound sign is mangled.
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Filenames are not content-hashed, so the browser must revalidate them
# on every load. Without this a returning visitor can get new HTML against
# a cached older script after a deploy, which fails silently.
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# artifact.html is the wrapper-less source for the hosted Artifact.
# It must never be served: no doctype means quirks mode.
[[redirects]]
  from = "/artifact.html"
  to = "/"
  status = 301
  force = true
